# JVM and Android build settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Deployment configuration. These values are not secrets and are supplied at
# build time (here, by -P flags, or by environment variables). See README.md.
#
# The management origin is the HTTPS origin of the Wickmail web app. An empty
# value produces a build that reports a configuration error instead of loading
# an arbitrary origin.
wickmail.managementOrigin=
# Comma-separated additional HTTPS origins whose pages may load inside the
# privileged WebView, such as an external identity provider's authentication
# pages. Leave empty to load only the management origin internally.
wickmail.identityOrigins=
# Comma-separated hostnames that may deliver alias app links, for example
# `wickmail.example.com`. The first host is declared in the manifest.
wickmail.appLinkHosts=
# Whether the optional biometric app lock is enabled by default when the device
# supports it. The value is a boolean and can be overridden at runtime.
wickmail.appLockDefault=true
