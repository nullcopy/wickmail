[package]
name = "wickmail-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Policy lookup, LMTP proxy, lease engine, and management API for Wickmail"

[lints]
workspace = true

[features]
default = ["passkeys"]
# Optional WebAuthn passkey support. Disabling it removes the `webauthn-rs`
# dependency and the OpenSSL build requirement; password and token
# authentication keep working.
passkeys = ["dep:webauthn-rs", "dep:url"]

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.6", features = ["json", "query", "http1"] }
base64 = "0.22.1"
getrandom = "0.4.3"
idna = "1.1.0"
rsa = { version = "0.9.9", features = ["sha2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
url = { version = "2.5.7", optional = true }
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }
webauthn-rs = { version = "0.5.5", default-features = false, optional = true }

[dev-dependencies]
http-body-util = "0.1.3"
rand = "0.8.5"
tempfile = "3.27.0"
tower = { version = "0.5.2", features = ["util"] }
